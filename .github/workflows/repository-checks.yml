name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required community files
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md

      - name: Solidity license headers
        run: |
          missing=$(find Remix/contracts -name '*.sol' -print0 | xargs -0 grep -L 'SPDX-License-Identifier')
          if [ -n "$missing" ]; then
            echo "$missing"
            exit 1
          fi

      - name: Block generated artifacts
        run: |
          if find . -path './.git' -prune -o \( -name '.vsdbg' -o -name 'connectwebgl.zip' -o -name '*.user' \) -print | grep .; then
            echo "Generated artifacts or local files are still tracked."
            exit 1
          fi

